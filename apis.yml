name: Prezi
description: >-
  Prezi is a presentation software company whose cloud platform lets people
  create and deliver zooming, non-linear presentations as an alternative to
  traditional slide decks, alongside Prezi Video for on-screen presenting and
  Prezi Design for visual assets. Its AI features generate studio-quality decks
  from a prompt or an uploaded PPTX, PDF, or DOCX. Prezi serves individuals,
  educators, and business teams, and is a portfolio company of Accel. Prezi does
  not currently publish a public developer API, SDK, or developer portal; this
  API Evangelist profile captures the company's public developer-adjacent
  surface (security posture, status, source repositories, and legal/commercial
  pages) discovered during enrichment.
